# CI — manual-only (Actions tab → Run workflow on the branch to verify). Nothing runs automatically.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          black --check src tests scripts
          bandit -q -r src
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q
      - name: Per-file coverage floors
        run: python scripts/check_coverage.py
      - name: Build
        run: python -m build
