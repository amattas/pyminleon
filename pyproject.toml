[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyminleon"
version = "0.1.0"
description = "Asyncio control of Minleon NDB-Pro LED controllers' built-in effects over HTTP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Anthony Mattas", email = "anthony@mattas.net" }
]
keywords = ["minleon", "ndb-pro", "led", "lighting", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "ruff==0.17.2",
    "pre-commit==4.7.0",
    "build==1.6.1",
    "bandit==1.9.4",
]

[project.urls]
Source = "https://github.com/amattas/pyminleon"

[tool.hatch.build.targets.wheel]
packages = ["src/pyminleon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing:skip-covered --cov-report=json"

[tool.coverage.run]
source = ["src/pyminleon"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
